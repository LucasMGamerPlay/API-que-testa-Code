name: CI

on:
  push:
  pull_request:

jobs:
  docker-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build image
        run: docker compose build
      - name: Run tests
        run: docker compose run --rm codepulse pytest -q -p no:cacheprovider
